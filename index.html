    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: bold; }
        .hidden { display: none !important; }
        th, td { padding: 8px 12px !important; }
        
        @media print {
            body { background: white; }
            no-print { display: none; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }

            tfoot { display: table-footer-group; }

        @page {
            size: A4 portrait;
            margin: 15mm;

<body class="bg-gray-100 text-gray-800 pb-10">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">إدارة المحروقات (سحابي)</h1>
        <div id="userInfo" class="hidden text-sm items-center gap-4" style="display: none;">
            <span id="userNameDisplay"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded font-bold">خروج</button>
        </div>
    </header>

    <div id="login-screen" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-lg shadow-md block">
        <h2 class="text-xl font-bold mb-6 text-center text-blue-700">تسجيل الدخول</h2>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">رقم الهوية (اسم المستخدم)</label>
            <input type="text" id="loginId" class="w-full border p-2 rounded focus:ring focus:ring-blue-200">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">كلمة المرور</label>
            <input type="password" id="loginPass" class="w-full border p-2 rounded focus:ring focus:ring-blue-200">
        </div>
        <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">دخول</button>
    </div>

    <div id="main-app" class="hidden" style="display: none;">
        
        <div class="flex justify-around bg-white shadow-sm mb-4 text-sm font-medium" id="nav-menu">
            <button onclick="switchTab('input-tab')" id="btn-input-tab" class="tab-btn active w-full py-3 text-gray-600 hidden" style="display: none;">تسجيل شحنة</button>
            <button onclick="switchTab('report-tab')" id="btn-report-tab" class="tab-btn w-full py-3 text-gray-600">التقارير</button>
            <button onclick="switchTab('audit-tab')" id="btn-audit-tab" class="tab-btn w-full py-3 text-gray-600 hidden" style="display: none;">سجل المحذوفات</button>
            <button onclick="switchTab('settings-tab')" id="btn-settings-tab" class="tab-btn w-full py-3 text-gray-600 hidden" style="display: none;">الإعدادات</button>
        </div>

        <div class="max-w-2xl mx-auto p-4">
            
            <div id="input-tab" class="hidden" style="display: none;">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 id="formTitle" class="text-lg font-semibold mb-4 border-b pb-2">تسجيل بيانات جديدة</h2>
                    <form id="fuelForm" onsubmit="saveData(event)">
                        <input type="hidden" id="editingTxnId" value="">
                        
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">التاريخ</label>
                            <input type="date" id="dateInput" required class="w-full border p-2 rounded focus:ring focus:ring-blue-200">
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">الجهة المستفيدة</label>
                            <select id="beneficiaryInput" required class="w-full border p-2 rounded focus:ring focus:ring-blue-200"></select>
                        </div>

                        <div class="flex gap-3 mb-4">
                            <div class="w-1/2">
                                <label class="block text-sm font-medium mb-1">نوع الوقود / الصنف</label>
                                <select id="typeInput" onchange="updateUnitBasedOnType()" required class="w-full border p-2 rounded focus:ring focus:ring-blue-200"></select>
                            </div>
                            <div class="w-1/2">
                                <label class="block text-sm font-medium mb-1">الكمية</label>
                                <div class="flex">
                                    <input type="number" id="quantityInput" placeholder="الرقم" required class="w-2/3 border p-2 rounded-r focus:ring focus:ring-blue-200" step="any">
                                    <select id="unitInput" class="w-1/3 border-y border-l p-2 rounded-l bg-gray-50 focus:ring focus:ring-blue-200 text-xs">
                                        <option value="لتر">لتر</option>
                                        <option value="طن">طن</option>
                                        <option value="كوب">كوب</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-1">عدد الشاحنات</label>
                            <input type="number" id="trucksInput" placeholder="عدد الشاحنات" required min="1" class="w-full border p-2 rounded focus:ring focus:ring-blue-200">
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">حفظ البيانات</button>
                        <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="w-full mt-2 bg-gray-400 text-white font-bold py-2 rounded hover:bg-gray-500 hidden" style="display: none;">إلغاء التعديل</button>
                    </form>
                </div>
            </div>

            <div id="report-tab" class="hidden" style="display: none;">
                <div class="bg-white p-4 rounded-lg shadow-md mb-4">
                    <h2 class="text-lg font-semibold mb-3 border-b pb-2">فلترة التقرير</h2>
                    <div class="flex gap-2 mb-3">
                        <div class="w-1/3">
                            <label class="block text-xs font-medium mb-1">نوع الوقود</label>
                            <select id="typeFilter" class="w-full border p-2 rounded text-xs bg-gray-50"></select>
                        </div>
                        <div class="w-1/3">
                            <label class="block text-xs font-medium mb-1">من تاريخ</label>
                            <input type="date" id="startDate" class="w-full border p-2 rounded text-xs">
                        </div>
                        <div class="w-1/3">
                            <label class="block text-xs font-medium mb-1">إلى تاريخ</label>
                            <input type="date" id="endDate" class="w-full border p-2 rounded text-xs">
                        </div>
                    </div>
